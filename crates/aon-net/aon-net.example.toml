[server]
# The Station uses TCP port 80 for PowerOn.
bind-ip = "0.0.0.0"
http-port = 80
# PowerOn and secure administration each get this many connection slots.
http-connection-limit = 64
# AON.Net cancels an HTTP request that takes longer than this.
http-request-timeout-seconds = 10
# This limit applies before AON.Net parses a PowerOn or admin request body.
http-body-limit-bytes = 65536
# All Tower and Station TCP services share this connection limit.
game-connection-limit = 256
# AON.Net disconnects a Tower service connection if I/O stops for this long.
tower-connection-timeout-seconds = 30
database-path = "aon-net.db"

# Tower and Station binary services.
game-port = 33437
matching-port = 33438
relay-ports = [33439, 33440, 33441]

# AON.Net listens on gameplay-port. It sends the advertised endpoint to
# matched Stations. Change the advertised host when clients run on other hosts.
gameplay-port = 33442
gameplay-advertise-host = "gameservers.aonnet"
gameplay-advertise-port = 33442
# Each Station has one queue for gameplay records from the other players.
# AON.Net disconnects the Station if this queue becomes full.
gameplay-relay-queue-capacity = 4096
# AON.Net disconnects a Station if gameplay I/O stops for this long.
gameplay-player-timeout-seconds = 10
# This limits matching I/O and the handoff from matching to gameplay.
matching-player-timeout-seconds = 10

[admin-security]
# Keep this false for simple local hosting. The admin interface then uses HTTP.
enabled = false
# If enabled is true, AON.Net serves the admin interface on HTTPS port 443.
# Use a PEM certificate chain and its private key. Relative paths start at the
# server working directory. The token must contain at least 32 bytes.
# tls-public-cert = "fullchain.pem"
# tls-private-key = "private-key.pem"
# admin-token = "replace-with-a-long-random-token"


[power-on]
# The Tower requires both fields before the game service is available. Do not change.
uri = "/"
host = "aonnet"

# AON.Net reads UTF-8 and encodes these values as Shift_JIS on the wire.
shop-name = "AON.Net Local Shop"
shop-nickname = "AON"
region-code = "0"
region-name-0 = "Local"
region-name-1 = "Local"
region-name-2 = "Local"
region-name-3 = "Local"
place-id = "AON0001"


# AON.Net sends announcements in start-time order. Add at most 16 entries.
# The Tower can show a future announcement early. Do not add it before its start.
# [[announcements]]
# start = "2009-08-03 12:30"
# end = "2009-08-04 23:59"
# sub-minute = 0
# text = "Announcement text"
