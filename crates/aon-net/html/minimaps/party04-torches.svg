<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -20 184 184" role="img" aria-labelledby="title desc">
  <title id="title">Eight poison-trap locations</title>
  <desc id="desc">The second quest area with all eight poison traps and the next event area marked.</desc>
  <g transform="rotate(-45 80 72)">
    <image width="160" height="144" href="data:image/png;base64,"/>
    <g fill="#d52d3a" stroke="#ffd3a5" stroke-width="1.5" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">
      <circle cx="50.5" cy="55" r="5"/><text x="50.5" y="58" fill="#fff" stroke="none">1</text>
      <circle cx="50" cy="81" r="5"/><text x="50" y="84" fill="#fff" stroke="none">2</text>
      <circle cx="64" cy="55.5" r="5"/><text x="64" y="58.5" fill="#fff" stroke="none">3</text>
      <circle cx="64" cy="81" r="5"/><text x="64" y="84" fill="#fff" stroke="none">4</text>
