[package]
name = "aon-net-admin"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"

[features]
ui = []

[[bin]]
name = "aon-net-admin"
path = "src/main.rs"
required-features = ["ui"]
test = false
bench = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "=0.7.0", features = ["http", "json"] }
leptos = { version = "=0.8.20", features = ["csr"] }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["EventSource", "HashChangeEvent", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "MessageEvent", "Window"] }

[lints]
workspace = true
